[tool.poetry]
name = "behavry-context-audit"
version = "0.1.0"
description = "Measure how many context-window tokens your MCP servers consume before an agent does any work"
authors = ["Behavry <oss@behavry.ai>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/Behavry-ai/context-audit"
repository = "https://github.com/Behavry-ai/context-audit"
keywords = ["mcp", "model-context-protocol", "context-window", "ai-agents", "llm", "tokens", "audit", "governance", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
packages = [{include = "context_audit"}]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/Behavry-ai/context-audit/issues"
"Source" = "https://github.com/Behavry-ai/context-audit"

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27.0"
click = ">=8.0"
rich = ">=13.0"
tiktoken = {version = ">=0.7", optional = true}

[tool.poetry.extras]
exact = ["tiktoken"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.8"

[tool.poetry.scripts]
context-audit = "context_audit.cli:main"
behavry-context-audit = "context_audit.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
